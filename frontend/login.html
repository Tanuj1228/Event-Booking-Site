<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventEase - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <header>
        <h1>EventEase</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>
    </header>
    <main>
        <div class="auth-container">
            <h2>Welcome Back</h2>
            <form id="login-form">
                <div class="input-group">
                    <input type="email" id="email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <button type="submit" class="full-width-btn">Login</button>
            </form>
        </div>
    </main>
    <script src="js/auth.js"></script>
    <script>
        gsap.from(".auth-container", { scale: 0.9, opacity: 0, duration: 0.8, ease: "back.out(1.5)", y: 50 });
        gsap.from(".input-group", { opacity: 0, x: -30, duration: 0.6, stagger: 0.1, delay: 0.3 });
        gsap.from(".full-width-btn", { opacity: 0, y: 20, duration: 0.6, delay: 0.6 });
    </script>
</body>
</html>
