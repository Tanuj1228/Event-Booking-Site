<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventEase - My Profile</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <header class="nav-anim">
        <h1>EventEase</h1>
        <nav id="main-nav">
            <a href="index.html">Home</a>
        </nav>
    </header>
    <main>
        <h2 class="title-anim" style="text-align: center; margin-bottom: 30px; color: var(--dark);">My Bookings</h2>
        <div id="bookings-list" class="event-grid"></div>
    </main>
    <script src="js/profile.js"></script>
    <script>
        gsap.from(".nav-anim", { y: -50, opacity: 0, duration: 1, ease: "power3.out" });
        gsap.from(".title-anim", { y: 20, opacity: 0, duration: 1, delay: 0.3, ease: "power3.out" });
    </script>
</body>
</html>
