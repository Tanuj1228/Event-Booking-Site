<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventEase - My Bookings</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <header class="nav-anim">
        <h1>EventEase</h1>
        <nav id="main-nav">
            </nav>
    </header>
    <main>
        <div class="fade-in-anim" style="text-align: center; margin-bottom: 30px;">
            <h2 style="color: var(--dark);">My Bookings</h2>
            <p style="color: #666; margin-top: 10px;">Check your email for your official QR Code entry tickets.</p>
        </div>

        <section id="bookings-section" class="fade-in-anim">
            <div id="bookings-list" class="event-grid">
                </div>
        </section>
    </main>
    <script src="js/profile.js"></script>
    <script>
        if(typeof gsap !== 'undefined') {
            gsap.from(".nav-anim", { y: -50, opacity: 0, duration: 1, ease: "power3.out" });
            gsap.from(".fade-in-anim", { opacity: 0, y: 20, duration: 0.8, stagger: 0.2, ease: "power2.out" });
        }
    </script>
</body>
</html>
