<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventEase - Organizer Panel</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
    <header class="nav-anim">
        <h1>EventEase Organizer</h1>
        <nav id="main-nav">
            </nav>
    </header>
    <main>
        <div class="admin-tabs fade-in-anim">
            <button class="tab-btn active" id="tab-my-events">My Events</button>
            <button class="tab-btn" id="tab-create">Host New Event</button>
            <button class="tab-btn" id="tab-scan" style="background: var(--primary); color: white;">Scan Tickets</button>
        </div>

        <section id="my-events-section" class="fade-in-anim">
            <h2 style="text-align: center; margin-bottom: 20px;">Events Hosted By You</h2>
            <div id="organizer-events-list" class="event-grid">
                </div>
        </section>

        <section id="create-section" class="form-container fade-in-anim" style="display: none;">
            <h2>Host a New Event</h2>
            <p style="text-align: center; margin-bottom: 20px; color: var(--text); font-size: 0.9rem;">
                Note: New events require Admin approval before students can book tickets.
            </p>
            <form id="create-event-form">
                <div class="input-group">
                    <input type="text" id="eventName" placeholder="Event Name" required>
                </div>
                <div class="input-group">
                    <input type="text" id="venue" placeholder="Venue" required>
                </div>
                <div class="input-group">
                    <input type="datetime-local" id="date" required>
                </div>
                <div class="input-group">
                    <input type="text" id="category" placeholder="Category (e.g., Concert, Tech Fest)" required>
                </div>
                <div class="input-group">
                    <input type="number" id="price" placeholder="Ticket Price (₹)" required min="0">
                </div>
                <div class="input-group">
                    <input type="number" id="totalSeats" placeholder="Total Seats" required min="1">
                </div>
                <button type="submit" class="full-width-btn">Submit for Approval</button>
            </form>
        </section>

        <section id="scan-section" class="form-container fade-in-anim" style="display: none; max-width: 600px;">
            <h2 style="text-align: center;">Ticket Check-in Scanner</h2>
            <div style="width: 100%; margin: 20px auto 0; background: white; padding: 20px; border-radius: 10px; box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);">
                <div id="reader" style="width: 100%;"></div>
                <div id="scan-result" style="margin-top: 20px; text-align: center; font-size: 1.2rem; font-weight: bold;"></div>
            </div>
        </section>
    </main>
    <script src="js/organizer.js"></script>
    <script>
        if(typeof gsap !== 'undefined') {
            gsap.from(".nav-anim", { y: -50, opacity: 0, duration: 1, ease: "power3.out" });
            gsap.from(".fade-in-anim", { opacity: 0, y: 20, duration: 0.8, stagger: 0.2, ease: "power2.out" });
        }
    </script>
</body>
</html>
