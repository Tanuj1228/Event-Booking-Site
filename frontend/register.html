<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventEase - Register</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <header>
        <h1>EventEase</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>
    </header>
    <main>
        <div class="auth-container">
            <h2>Create Account</h2>
            <form id="register-form">
                <div class="input-group">
                    <input type="text" id="name" placeholder="Full Name" required>
                </div>
                <div class="input-group">
                    <input type="email" id="email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <button type="submit" class="full-width-btn">Register</button>
            </form>
        </div>
    </main>
    <script src="js/auth.js"></script>
    <script>
        if(typeof gsap !== 'undefined') {
            gsap.fromTo(".auth-container", 
                { scale: 0.9, opacity: 0, y: 50 }, 
                { scale: 1, opacity: 1, y: 0, duration: 0.8, ease: "back.out(1.5)", clearProps: "all" }
            );
            gsap.fromTo(".input-group", 
                { opacity: 0, x: -30 }, 
                { opacity: 1, x: 0, duration: 0.6, stagger: 0.1, delay: 0.3, clearProps: "all" }
            );
            gsap.fromTo(".full-width-btn", 
                { opacity: 0, y: 20 }, 
                { opacity: 1, y: 0, duration: 0.6, delay: 0.7, clearProps: "all" }
            );
        }
    </script>
</body>
</html>
