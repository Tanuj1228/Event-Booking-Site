<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventEase - Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>EventEase</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>
    </header>
    <main>
        <div class="auth-container">
            <h2>Register</h2>
            <form id="register-form">
                <input type="text" id="name" placeholder="Full Name" required style="display: block; margin-bottom: 10px; padding: 8px;">
                <input type="email" id="email" placeholder="Email" required style="display: block; margin-bottom: 10px; padding: 8px;">
                <input type="password" id="password" placeholder="Password" required style="display: block; margin-bottom: 10px; padding: 8px;">
                <button type="submit" style="padding: 10px 15px; cursor: pointer;">Register</button>
            </form>
        </div>
    </main>
    <script src="js/auth.js"></script>
</body>
</html>
