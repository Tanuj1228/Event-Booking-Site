<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventEase - Register</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <header class="nav-anim">
        <h1>EventEase</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>
    </header>
    <main>
        <div class="auth-container">
            <h2>Create Account</h2>
            <form id="register-form">
                <div class="input-group">
                    <input type="text" id="name" placeholder="Full Name" required>
                </div>
                <div class="input-group">
                    <input type="email" id="email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <div class="input-group">
                    <select id="role" required>
                        <option value="" disabled selected>Select Account Type</option>
                        <option value="student">Student (Book Tickets)</option>
                        <option value="organizer">Organizer (Host Events)</option>
                        <option value="admin">Admin (System Management)</option>
                    </select>
                </div>
                <button type="submit" class="full-width-btn">Register</button>
            </form>
        </div>
    </main>
    <script src="js/auth.js"></script>
    <script>
        if(typeof gsap !== 'undefined') {
            gsap.fromTo(".auth-container", 
                { scale: 0.9, opacity: 0, y: 50 }, 
                { scale: 1, opacity: 1, y: 0, duration: 0.8, ease: "back.out(1.5)" }
            );
            gsap.from(".nav-anim", { y: -50, opacity: 0, duration: 1, ease: "power3.out" });
        }
    </script>
</body>
</html>
