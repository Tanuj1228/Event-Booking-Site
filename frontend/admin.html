<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventEase - Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <header class="nav-anim">
        <h1>EventEase Admin</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="#" id="logout-btn" style="color: var(--danger); font-weight: 600;">Logout</a>
        </nav>
    </header>
    <main>
        <div class="form-container">
            <h2>Create New Event</h2>
            <form id="create-event-form">
                <div class="input-group">
                    <input type="text" id="eventName" placeholder="Event Name" required>
                </div>
                <div class="input-group">
                    <input type="text" id="venue" placeholder="Venue" required>
                </div>
                <div class="input-group">
                    <input type="datetime-local" id="date" required>
                </div>
                <div class="input-group">
                    <input type="text" id="category" placeholder="Category (e.g., Concert, Fest)" required>
                </div>
                <div class="input-group">
                    <input type="number" id="price" placeholder="Ticket Price (Rs.)" required>
                </div>
                <div class="input-group">
                    <input type="number" id="totalSeats" placeholder="Total Seats" required>
                </div>
                <button type="submit" class="full-width-btn">Create Event</button>
            </form>
        </div>
    </main>
    <script src="js/admin.js"></script>
    <script>
        gsap.from(".nav-anim", { y: -50, opacity: 0, duration: 1, ease: "power3.out" });
        gsap.from(".form-container", { scale: 0.9, opacity: 0, duration: 0.8, ease: "back.out(1.5)", y: 50 });
        gsap.from(".input-group", { opacity: 0, x: -30, duration: 0.6, stagger: 0.1, delay: 0.3 });
        gsap.from(".full-width-btn", { opacity: 0, y: 20, duration: 0.6, delay: 0.8 });
    </script>
</body>
</html>
