<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventEase - Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header class="nav-anim">
        <h1>EventEase Admin</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="#" id="logout-btn" style="color: var(--danger); font-weight: 600;">Logout</a>
        </nav>
    </header>
    <main>
        <div class="admin-tabs fade-in-anim">
            <button class="tab-btn active" id="tab-dashboard">Dashboard & Analytics</button>
            <button class="tab-btn" id="tab-create">Create Event</button>
        </div>

        <section id="dashboard-section" class="fade-in-anim">
            <div class="dashboard-grid">
                <div class="stat-card">
                    <h3 id="stat-revenue">₹0</h3>
                    <p>Total Revenue</p>
                </div>
                <div class="stat-card">
                    <h3 id="stat-bookings">0</h3>
                    <p>Total Bookings</p>
                </div>
                <div class="stat-card">
                    <h3 id="stat-tickets">0</h3>
                    <p>Tickets Sold</p>
                </div>
                <div class="stat-card">
                    <h3 id="stat-users">0</h3>
                    <p>Total Users</p>
                </div>
            </div>
            
            <div class="chart-container">
                <canvas id="revenueChart"></canvas>
            </div>
        </section>

        <section id="create-section" class="form-container" style="display: none;">
            <h2>Create New Event</h2>
            <form id="create-event-form">
                <div class="input-group">
                    <input type="text" id="eventName" placeholder="Event Name" required>
                </div>
                <div class="input-group">
                    <input type="text" id="venue" placeholder="Venue" required>
                </div>
                <div class="input-group">
                    <input type="datetime-local" id="date" required>
                </div>
                <div class="input-group">
                    <input type="text" id="category" placeholder="Category (e.g., Concert, Fest)" required>
                </div>
                <div class="input-group">
                    <input type="number" id="price" placeholder="Ticket Price (₹)" required>
                </div>
                <div class="input-group">
                    <input type="number" id="totalSeats" placeholder="Total Seats" required>
                </div>
                <button type="submit" class="full-width-btn">Create Event</button>
            </form>
        </section>
    </main>
    <script src="js/admin.js"></script>
    <script>
        gsap.from(".nav-anim", { y: -50, opacity: 0, duration: 1, ease: "power3.out" });
        gsap.from(".fade-in-anim", { opacity: 0, y: 20, duration: 0.8, stagger: 0.2, ease: "power2.out" });
    </script>
</body>
</html>
