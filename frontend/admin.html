<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventEase - Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header class="nav-anim">
        <h1>EventEase System Admin</h1>
        <nav id="main-nav">
            </nav>
    </header>
    <main>
        <div class="admin-tabs fade-in-anim">
            <button class="tab-btn active" id="tab-dashboard">Analytics Dashboard</button>
            <button class="tab-btn" id="tab-approvals">Pending Approvals</button>
        </div>

        <section id="dashboard-section" class="fade-in-anim">
            <div class="dashboard-grid">
                <div class="stat-card">
                    <h3 id="stat-revenue">₹0</h3>
                    <p>Total Revenue</p>
                </div>
                <div class="stat-card">
                    <h3 id="stat-bookings">0</h3>
                    <p>Total Bookings</p>
                </div>
                <div class="stat-card">
                    <h3 id="stat-tickets">0</h3>
                    <p>Tickets Sold</p>
                </div>
                <div class="stat-card">
                    <h3 id="stat-users">0</h3>
                    <p>Total Students</p>
                </div>
            </div>
            
            <div class="chart-container">
                <canvas id="revenueChart"></canvas>
            </div>
        </section>

        <section id="approvals-section" style="display: none;" class="fade-in-anim">
            <h2 style="text-align: center; margin-bottom: 20px;">Pending Events</h2>
            <div id="pending-events-list">
                </div>
        </section>
    </main>
    <script src="js/admin.js"></script>
    <script>
        if(typeof gsap !== 'undefined') {
            gsap.from(".nav-anim", { y: -50, opacity: 0, duration: 1, ease: "power3.out" });
            gsap.from(".fade-in-anim", { opacity: 0, y: 20, duration: 0.8, stagger: 0.2, ease: "power2.out" });
        }
    </script>
</body>
</html>
